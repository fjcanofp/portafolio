title: fjcanogra
author:
  name: Fco. Javier Cano Granado
email: "contacto@fjcanogra.es"
description: >-
  Portfolio docente y técnico de Fco. Javier Cano Granado: Formación Profesional de Informática,
  módulos, talleres, artículos y materiales propios.
lang: es
timezone: Europe/Madrid
url: "https://fjcanogra.es"
baseurl: ""

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
show_excerpts: true
paginate: 5
paginate_path: "/blog/page/:num/"

social:
  linkedin: "https://www.linkedin.com/in/fjcanogra/"
  github: "https://github.com/fjcanofp"
  buymeacoffee: "https://buymeacoffee.com/fjcanogra"

support_enabled: false

collections:
  cycles:
    output: true
    sort_by: order
  modules:
    output: true
    sort_by: order
  units:
    output: true
    sort_by: order
  workshops:
    output: true
    permalink: /talleres/:name/
    sort_by: date

defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: modules
    values:
      layout: module
  - scope:
      path: ""
      type: workshops
    values:
      layout: workshop
  - scope:
      path: ""
      type: cycles
    values:
      layout: cycle
  - scope:
      path: ""
      type: units
    values:
      layout: unit

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

sass:
  style: compressed

exclude:
  - README.md
  - DEPLOY_GUIDE.md
  - CONTENT_WORKFLOW.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
