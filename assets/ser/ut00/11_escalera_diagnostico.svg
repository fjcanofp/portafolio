<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Escalera de diagnóstico"><rect width="1200" height="675" rx="24" fill="#F5F8FC"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#263238}.h{font-size:34px;font-weight:700;fill:#17365D}.s{font-size:24px;font-weight:700}.b{font-size:20px}.sm{font-size:17px;fill:#6B7785}.line{stroke:#17365D;stroke-width:5;fill:none}.dash{stroke:#6B7785;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><text x="60" y="58" class="t h" text-anchor="start">Diagnóstico: comprobar capas, no cambiar cosas al azar</text><rect x="80" y="110" width="220" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="137" class="t sm" text-anchor="start">1. VM / cable virtual</text><rect x="80" y="159" width="294" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="186" class="t sm" text-anchor="start">2. Interfaz e IP</text><rect x="80" y="208" width="368" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="235" class="t sm" text-anchor="start">3. Red local / vecino</text><rect x="80" y="257" width="442" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="284" class="t sm" text-anchor="start">4. Ruta</text><rect x="80" y="306" width="516" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="333" class="t sm" text-anchor="start">5. DNS</text><rect x="80" y="355" width="590" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="382" class="t sm" text-anchor="start">6. Puerto / transporte</text><rect x="80" y="404" width="664" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="431" class="t sm" text-anchor="start">7. Servicio / proceso</text><rect x="80" y="453" width="738" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="480" class="t sm" text-anchor="start">8. Aplicación</text><rect x="80" y="502" width="812" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="529" class="t sm" text-anchor="start">9. Permisos / seguridad</text><rect x="80" y="551" width="886" height="39" rx="10" fill="#FFFFFF" stroke="#2F5597" stroke-width="2"/><text x="96" y="578" class="t sm" text-anchor="start">10. Logs + regresión</text><text x="1090" y="615" class="t b" text-anchor="end">Empieza por la base.</text></svg>