<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Tarjeta virtual y modo de conexión"><rect width="1200" height="675" rx="24" fill="#F5F8FC"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#263238}.h{font-size:34px;font-weight:700;fill:#17365D}.s{font-size:24px;font-weight:700}.b{font-size:20px}.sm{font-size:17px;fill:#6B7785}.line{stroke:#17365D;stroke-width:5;fill:none}.dash{stroke:#6B7785;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><text x="60" y="58" class="t h" text-anchor="start">Tarjeta virtual ≠ modo de conexión</text><rect x="75" y="130" width="330" height="160" rx="18" fill="#EDF7EE" stroke="#4E9F6E" stroke-width="3"/><text x="240.0" y="170" class="t s" text-anchor="middle">vNIC</text><text x="240.0" y="200" class="t sm" text-anchor="middle">hardware que ve Debian</text><text x="240" y="230" class="t sm" text-anchor="middle">p. ej. enp0s3</text><path d="M405,210 L575,210" class="line" stroke="#17365D"/><polygon points="575,210 560,201 560,219" fill="#17365D"/><rect x="575" y="130" width="300" height="160" rx="18" fill="#E7F7F9" stroke="#2AA7B8" stroke-width="3"/><text x="725.0" y="170" class="t s" text-anchor="middle">MODO</text><text x="725.0" y="200" class="t sm" text-anchor="middle">dónde se conecta</text><rect x="180" y="350" width="210" height="80" rx="18" fill="#FFFFFF" stroke="#C94C4C" stroke-width="3"/><text x="285.0" y="390" class="t s" text-anchor="middle">Puente</text><rect x="430" y="350" width="210" height="80" rx="18" fill="#FFFFFF" stroke="#E58A2B" stroke-width="3"/><text x="535.0" y="390" class="t s" text-anchor="middle">Host-only</text><rect x="680" y="350" width="210" height="80" rx="18" fill="#FFFFFF" stroke="#4E9F6E" stroke-width="3"/><text x="785.0" y="390" class="t s" text-anchor="middle">Interna</text><rect x="930" y="350" width="210" height="80" rx="18" fill="#FFFFFF" stroke="#2F5597" stroke-width="3"/><text x="1035.0" y="390" class="t s" text-anchor="middle">NAT</text><text x="600" y="510" class="t b" text-anchor="middle">Adaptador 1/2 son ranuras; NAT, Interna o Puente definen su conexión.</text><text x="600" y="558" class="t sm" text-anchor="middle">Una IP correcta no compensa una conexión virtual equivocada.</text></svg>