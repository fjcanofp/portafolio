<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
<title id="title">Ejemplo de dato almacenado y dato derivado usando fecha de nacimiento y edad</title>
<desc id="desc">Ejemplo de dato almacenado y dato derivado usando fecha de nacimiento y edad</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".18"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#60a5fa"/>
  </marker>
  <marker id="arrowg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#34d399"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="30" fill="#0b1220"/>

<text x="700" y="70" fill="#f8fafc" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700">
  Un dato visible no siempre debe almacenarse
</text>
<text x="700" y="108" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20">
  Ejemplo: la edad cambia aunque nadie edite la fila
</text>

<rect x="85" y="190" width="330" height="210" rx="26" fill="#172033" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="250" y="245" fill="#93c5fd" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">DATO ALMACENADO</text>
<text x="250" y="305" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="28">fecha_nacimiento</text>
<text x="250" y="352" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">15/04/1990</text>

<rect x="535" y="190" width="330" height="210" rx="26" fill="#172033" stroke="#fbbf24" stroke-width="3" filter="url(#shadow)"/>
<text x="700" y="245" fill="#fde68a" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">CONTEXTO ACTUAL</text>
<text x="700" y="305" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="28">fecha_actual</text>
<text x="700" y="352" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">se obtiene al consultar</text>

<rect x="985" y="190" width="330" height="210" rx="26" fill="#13261f" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="1150" y="245" fill="#6ee7b7" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">DATO DERIVADO</text>
<text x="1150" y="305" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="30">edad</text>
<text x="1150" y="352" fill="#d1fae5" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">se calcula</text>

<path d="M415 295 L535 295" fill="none" stroke="#60a5fa" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M865 295 L985 295" fill="none" stroke="#34d399" stroke-width="5" marker-end="url(#arrowg)"/>

<rect x="260" y="500" width="880" height="145" rx="24" fill="#111827" stroke="#334155"/>
<text x="700" y="550" fill="#f8fafc" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700">
  Si guardáramos “edad = 36”, mañana podría estar desactualizada
</text>
<text x="700" y="595" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif" font-size="21">
  Guardamos el hecho estable y calculamos la información que depende del tiempo
</text>

</svg>