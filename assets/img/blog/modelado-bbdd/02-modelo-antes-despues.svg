<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Comparación entre un modelo redundante y un modelo basado en el dominio</title>
<desc id="desc">Comparación entre un modelo redundante y un modelo basado en el dominio</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".18"/>
  </filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#60a5fa"/>
  </marker>
  <marker id="arrowg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#34d399"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="30" fill="#0b1220"/>

<text x="700" y="62" fill="#f8fafc" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700">
  Del modelo que guarda datos al modelo que representa el dominio
</text>

<rect x="45" y="110" width="610" height="585" rx="28" fill="#111827" stroke="#ef4444" stroke-width="3"/>
<text x="350" y="160" fill="#fca5a5" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">ANTES</text>
<text x="350" y="195" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Relaciones y columnas que parecen funcionar</text>

<g font-family="Arial, sans-serif" filter="url(#shadow)">
  <rect x="95" y="240" width="220" height="110" rx="16" fill="#1e293b" stroke="#94a3b8"/>
  <text x="115" y="272" fill="#fff" font-size="20" font-weight="700">ELEMENTO</text>
  <text x="115" y="305" fill="#cbd5e1" font-size="17">empresa_id</text>
  <text x="115" y="333" fill="#fda4af" font-size="17">responsable_id ?</text>

  <rect x="385" y="240" width="220" height="150" rx="16" fill="#1e293b" stroke="#94a3b8"/>
  <text x="405" y="272" fill="#fff" font-size="20" font-weight="700">OBLIGACIÓN</text>
  <text x="405" y="305" fill="#fda4af" font-size="17">empresa_id repetido</text>
  <text x="405" y="333" fill="#cbd5e1" font-size="17">elemento_id</text>
  <text x="405" y="361" fill="#fda4af" font-size="17">estado guardado</text>

  <rect x="240" y="455" width="220" height="150" rx="16" fill="#1e293b" stroke="#94a3b8"/>
  <text x="260" y="487" fill="#fff" font-size="20" font-weight="700">REALIZACIÓN</text>
  <text x="260" y="520" fill="#fda4af" font-size="17">empresa_id repetido</text>
  <text x="260" y="548" fill="#cbd5e1" font-size="17">obligacion_id</text>
  <text x="260" y="576" fill="#fda4af" font-size="17">responsable_id ?</text>
</g>
<path d="M315 295 C350 295 355 305 385 315" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 9"/>
<path d="M495 390 C485 445 450 465 455 500" fill="none" stroke="#fb7185" stroke-width="4" stroke-dasharray="10 9"/>
<text x="350" y="650" fill="#fecaca" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">
  Un mismo hecho puede quedar representado varias veces
</text>

<rect x="745" y="110" width="610" height="585" rx="28" fill="#0f1e26" stroke="#34d399" stroke-width="3"/>
<text x="1050" y="160" fill="#6ee7b7" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">DESPUÉS</text>
<text x="1050" y="195" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Cada dato tiene un significado y un único lugar</text>

<g font-family="Arial, sans-serif" filter="url(#shadow)">
  <rect x="805" y="235" width="190" height="95" rx="16" fill="#172033" stroke="#34d399"/>
  <text x="900" y="270" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">EMPRESA</text>
  <text x="900" y="302" fill="#a7f3d0" text-anchor="middle" font-size="16">identidad</text>

  <rect x="1105" y="235" width="190" height="110" rx="16" fill="#172033" stroke="#34d399"/>
  <text x="1200" y="270" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">ELEMENTO</text>
  <text x="1200" y="302" fill="#cbd5e1" text-anchor="middle" font-size="16">empresa_id</text>

  <rect x="1105" y="420" width="190" height="128" rx="16" fill="#172033" stroke="#34d399"/>
  <text x="1200" y="455" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">OBLIGACIÓN</text>
  <text x="1200" y="487" fill="#cbd5e1" text-anchor="middle" font-size="16">elemento_id</text>
  <text x="1200" y="515" fill="#a7f3d0" text-anchor="middle" font-size="16">regla periódica</text>

  <rect x="805" y="420" width="190" height="128" rx="16" fill="#172033" stroke="#34d399"/>
  <text x="900" y="455" fill="#fff" text-anchor="middle" font-size="20" font-weight="700">EJECUCIÓN</text>
  <text x="900" y="487" fill="#cbd5e1" text-anchor="middle" font-size="16">obligacion_id</text>
  <text x="900" y="515" fill="#a7f3d0" text-anchor="middle" font-size="16">realizada_por</text>
</g>
<path d="M995 282 L1105 282" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1200 345 L1200 420" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M1105 484 L995 484" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrowg)"/>
<text x="1050" y="650" fill="#d1fae5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">
  Menos redundancia · más significado · histórico explícito
</text>

</svg>