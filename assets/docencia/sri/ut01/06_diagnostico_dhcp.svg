<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Secuencia de diagnóstico DHCP</title>
  <desc id="desc">Secuencia de diagnóstico DHCP</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="30" fill="url(#bg)"/>
  <text x="600" y="45" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Diagnóstico DHCP basado en evidencias</text>
<rect x="55" y="190" width="190" height="140" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="150.0" y="232" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Config</text>
<text x="150.0" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">kea-dhcp4 -t</text>
<line x1="245" y1="260" x2="280" y2="260" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="280" y="190" width="190" height="140" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="375.0" y="232" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Servicio</text>
<text x="375.0" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">status + logs</text>
<line x1="470" y1="260" x2="505" y2="260" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="505" y="190" width="190" height="140" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="600.0" y="232" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Tráfico</text>
<text x="600.0" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">Discover / Offer</text>
<line x1="695" y1="260" x2="730" y2="260" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="730" y="190" width="190" height="140" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="825.0" y="232" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Cliente</text>
<text x="825.0" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">IP + rutas</text>
<line x1="920" y1="260" x2="955" y2="260" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="955" y="190" width="190" height="140" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="1050.0" y="232" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Lease</text>
<text x="1050.0" y="268" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">CSV / ACK</text>
<text x="600" y="470" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd5e1">`ss` puede ser una comprobación auxiliar; la evidencia fuerte combina varias capas</text>
</svg>