<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Tiempos T1 y T2 de una concesión DHCP</title>
  <desc id="desc">Tiempos T1 y T2 de una concesión DHCP</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="30" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Vida de una concesión DHCP</text>
<line x1="120" y1="300" x2="1080" y2="300" stroke="#64748b" stroke-width="6"/>
<circle cx="120" cy="300" r="14" fill="#60a5fa"/>
<text x="120" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">0</text>
<text x="120" y="355" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">ACK</text>
<circle cx="510" cy="300" r="14" fill="#60a5fa"/>
<text x="510" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">T1</text>
<text x="510" y="355" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">renovación</text>
<circle cx="840" cy="300" r="14" fill="#60a5fa"/>
<text x="840" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">T2</text>
<text x="840" y="355" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">rebind</text>
<circle cx="1080" cy="300" r="14" fill="#60a5fa"/>
<text x="1080" y="265" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#f8fafc">fin</text>
<text x="1080" y="355" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">expira</text>
<text x="600" y="470" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">T1 intenta renovar con el servidor conocido; T2 amplía la búsqueda</text>
</svg>