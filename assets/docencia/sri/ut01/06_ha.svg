<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="560" viewBox="0 0 1250 560"><rect width="1250" height="560" fill="#07111f"/><text x="60" y="60" fill="#e5eefb" font-size="34" font-family="Arial" font-weight="700">Alta disponibilidad (HA) · otro problema distinto del relay</text><rect x="80" y="190" rx="18" ry="18" width="290" height="180" fill="#0b2440" stroke="#4ade80" stroke-width="4"/><text x="225" y="230" text-anchor="middle" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="700">Kea primario</text><text x="225" y="265" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">sirve clientes normalmente</text><text x="225" y="300" text-anchor="middle" fill="#a7f3d0" font-size="22" font-family="Arial">sincroniza leases</text><rect x="480" y="190" rx="18" ry="18" width="290" height="180" fill="#0b2440" stroke="#f59e0b" stroke-width="4"/><text x="625" y="230" text-anchor="middle" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="700">Kea standby</text><text x="625" y="265" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">mantiene copia del estado</text><text x="625" y="300" text-anchor="middle" fill="#fde68a" font-size="22" font-family="Arial">entra si falla el primario</text><rect x="880" y="190" rx="18" ry="18" width="290" height="180" fill="#0b2440" stroke="#60a5fa" stroke-width="4"/><text x="1025" y="230" text-anchor="middle" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="700">Cliente</text><text x="1025" y="265" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">IPv4 automática</text><text x="1025" y="300" text-anchor="middle" fill="#a7f3d0" font-size="22" font-family="Arial">continúa trabajando si cae uno</text><line x1="370" y1="280" x2="480" y2="280" stroke="#f472b6" stroke-width="6"/><line x1="770" y1="280" x2="880" y2="280" stroke="#60a5fa" stroke-width="6"/><text x="425" y="255" text-anchor="middle" fill="#fbcfe8" font-size="20" font-family="Arial">HA hook + peers</text><text x="60" y="460" fill="#cbd5e1" font-size="24" font-family="Arial">Relay resuelve “cliente en otra LAN”. HA resuelve “si cae un servidor, que otro mantenga el servicio”.</text></svg>