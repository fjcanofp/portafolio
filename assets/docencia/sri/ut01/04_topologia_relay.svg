<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Topología DHCP con relay y segunda subred</title>
  <desc id="desc">Topología DHCP con relay y segunda subred</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="30" fill="url(#bg)"/>
  <text x="600" y="45" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Relay DHCP · segunda subred</text>
<rect x="70" y="200" width="270" height="145" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="205.0" y="242" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Kea</text>
<text x="205.0" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">LAN A · 10.37.P.0/24</text>
<rect x="465" y="170" width="270" height="205" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="600.0" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Relay</text>
<text x="600.0" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">upstream 10.37.P.254</text>
<text x="600.0" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">downstream 10.38.P.254</text>
<text x="600.0" y="308" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">giaddr</text>
<rect x="860" y="200" width="270" height="145" rx="22" fill="#1f2937" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
<text x="995.0" y="242" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Cliente B</text>
<text x="995.0" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">LAN B · 10.38.P.0/24</text>
<line x1="340" y1="272" x2="465" y2="272" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="735" y1="272" x2="860" y2="272" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<text x="600" y="500" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd5e1">El relay transporta la solicitud entre subredes y permite a Kea seleccionar la subnet4 adecuada</text>
</svg>