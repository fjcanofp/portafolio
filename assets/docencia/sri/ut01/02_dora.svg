<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580"><rect width="1200" height="580" fill="#07111f"/><text x="60" y="60" fill="#e5eefb" font-size="34" font-family="Arial" font-weight="700">DORA · así conversa un cliente con el servidor DHCP</text><rect x="140" y="120" rx="18" ry="18" width="260" height="360" fill="#0b2440" stroke="#60a5fa" stroke-width="4"/><text x="270" y="170" text-anchor="middle" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="700">Cliente</text><text x="270" y="208" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">0.0.0.0:68</text><rect x="800" y="120" rx="18" ry="18" width="260" height="360" fill="#0b2440" stroke="#4ade80" stroke-width="4"/><text x="930" y="170" text-anchor="middle" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="700">Servidor Kea</text><text x="930" y="208" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">10.37.7.23:67</text><line x1="400" y1="215" x2="800" y2="215" stroke="#f59e0b" stroke-width="5" marker-end="url(#arr)"/><text x="600" y="197" text-anchor="middle" fill="#fde68a" font-size="24" font-family="Arial" font-weight="700">1. DISCOVER</text><text x="600" y="230" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="Arial">¿Hay algún DHCP? Necesito configuración.</text><line x1="800" y1="290" x2="400" y2="290" stroke="#22c55e" stroke-width="5" marker-end="url(#arrL)"/><text x="600" y="272" text-anchor="middle" fill="#bbf7d0" font-size="24" font-family="Arial" font-weight="700">2. OFFER</text><text x="600" y="305" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="Arial">Te ofrezco 10.37.7.107 y estos parámetros.</text><line x1="400" y1="365" x2="800" y2="365" stroke="#38bdf8" stroke-width="5" marker-end="url(#arr)"/><text x="600" y="347" text-anchor="middle" fill="#bae6fd" font-size="24" font-family="Arial" font-weight="700">3. REQUEST</text><text x="600" y="380" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="Arial">Acepto esa dirección.</text><line x1="800" y1="440" x2="400" y2="440" stroke="#f472b6" stroke-width="5" marker-end="url(#arrL)"/><text x="600" y="422" text-anchor="middle" fill="#fbcfe8" font-size="24" font-family="Arial" font-weight="700">4. ACK</text><text x="600" y="455" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="Arial">Queda concedida. Ya puedes configurar la NIC.</text><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f59e0b"/></marker><marker id="arrL" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#22c55e"/></marker></defs></svg>