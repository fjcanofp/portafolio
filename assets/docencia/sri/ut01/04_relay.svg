<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560"><rect width="1300" height="560" fill="#07111f"/><text x="60" y="60" fill="#e5eefb" font-size="34" font-family="Arial" font-weight="700">Relay DHCP · por qué hace falta una tercera VM</text><rect x="70" y="180" rx="18" ry="18" width="280" height="180" fill="#0b2440" stroke="#4ade80" stroke-width="4"/><text x="210" y="220" text-anchor="middle" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="700">Servidor Kea</text><text x="210" y="258" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">srv-p07-l03</text><text x="210" y="290" text-anchor="middle" fill="#a7f3d0" font-size="22" font-family="Arial">10.37.7.23/24</text><text x="210" y="325" text-anchor="middle" fill="#fde68a" font-size="20" font-family="Arial">LAN A = 10.37.7.0/24</text><rect x="490" y="140" rx="18" ry="18" width="320" height="260" fill="#0b2440" stroke="#f59e0b" stroke-width="4"/><text x="650" y="180" text-anchor="middle" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="700">Relay / Router</text><text x="650" y="220" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">NIC A: 10.37.7.254/24</text><text x="650" y="255" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">NIC B: 10.38.7.254/24</text><text x="650" y="290" text-anchor="middle" fill="#a7f3d0" font-size="22" font-family="Arial">recibe broadcast en LAN B</text><text x="650" y="323" text-anchor="middle" fill="#a7f3d0" font-size="22" font-family="Arial">lo reenvía a Kea con giaddr</text><rect x="960" y="180" rx="18" ry="18" width="280" height="180" fill="#0b2440" stroke="#60a5fa" stroke-width="4"/><text x="1100" y="220" text-anchor="middle" fill="#f8fafc" font-size="30" font-family="Arial" font-weight="700">Cliente B</text><text x="1100" y="258" text-anchor="middle" fill="#bfdbfe" font-size="22" font-family="Arial">IPv4 automática</text><text x="1100" y="290" text-anchor="middle" fill="#a7f3d0" font-size="22" font-family="Arial">recibe IP de 10.38.7.0/24</text><text x="1100" y="325" text-anchor="middle" fill="#fde68a" font-size="20" font-family="Arial">LAN B = 10.38.7.0/24</text><line x1="350" y1="260" x2="490" y2="260" stroke="#4ade80" stroke-width="6"/><line x1="810" y1="260" x2="960" y2="260" stroke="#60a5fa" stroke-width="6"/><text x="80" y="465" fill="#cbd5e1" font-size="22" font-family="Arial">Sin relay, el Discover de LAN B se queda en LAN B. Con relay, Kea sí puede servir a clientes de otra subred.</text></svg>