<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Detección de servidor DHCP no autorizado</title>
  <desc id="desc">Detección de servidor DHCP no autorizado</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="30" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Dos servidores DHCP en la misma LAN</text>
<rect x="60" y="165" width="310" height="145" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="215.0" y="207" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Servidor legítimo</text>
<text x="215.0" y="243" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">Option 54 · A</text>
<text x="215.0" y="273" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">política esperada</text>
<rect x="830" y="165" width="310" height="145" rx="22" fill="#1f2937" stroke="#ef4444" stroke-width="3" filter="url(#shadow)"/>
<text x="985.0" y="207" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Servidor rogue</text>
<text x="985.0" y="243" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">Option 54 · B</text>
<text x="985.0" y="273" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">política inesperada</text>
<rect x="445" y="390" width="310" height="130" rx="22" fill="#1f2937" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
<text x="600.0" y="432" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Cliente</text>
<text x="600.0" y="468" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">recibe dos DHCPOFFER</text>
<line x1="250" y1="310" x2="500" y2="390" stroke="#34d399" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="950" y1="310" x2="700" y2="390" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow)"/>
<text x="600" y="580" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="400" fill="#cbd5e1">Comparar origen del Offer, Option 54 y parámetros ofrecidos permite detectar el conflicto</text>
</svg>