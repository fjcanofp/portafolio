<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Proceso DHCP DORA</title>
  <desc id="desc">Proceso DHCP DORA</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="30" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">DHCPv4 · proceso DORA</text>
<rect x="70" y="145" width="220" height="145" rx="22" fill="#1f2937" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
<text x="180.0" y="187" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">DISCOVER</text>
<text x="180.0" y="223" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">cliente → broadcast</text>
<rect x="350" y="145" width="220" height="145" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="460.0" y="187" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">OFFER</text>
<text x="460.0" y="223" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">servidor → propuesta</text>
<rect x="630" y="145" width="220" height="145" rx="22" fill="#1f2937" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
<text x="740.0" y="187" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">REQUEST</text>
<text x="740.0" y="223" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">cliente → elección</text>
<rect x="910" y="145" width="220" height="145" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="1020.0" y="187" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">ACK</text>
<text x="1020.0" y="223" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">servidor → concesión</text>
<line x1="290" y1="218" x2="350" y2="218" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="570" y1="218" x2="630" y2="218" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="850" y1="218" x2="910" y2="218" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<text x="600" y="390" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400" fill="#cbd5e1">Campos clave: xid · yiaddr · Option 50 · 51 · 53 · 54 · 58 · 59</text>
</svg>