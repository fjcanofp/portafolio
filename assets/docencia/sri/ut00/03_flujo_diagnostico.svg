<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Flujo profesional de diagnóstico</title>
  <desc id="desc">Flujo profesional de diagnóstico</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="30" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Método de diagnóstico</text>
<rect x="65" y="220" width="135" height="100" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="132.5" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Síntoma</text>
<line x1="200" y1="270" x2="225" y2="270" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="225" y="220" width="135" height="100" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="292.5" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Capa</text>
<line x1="360" y1="270" x2="385" y2="270" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="385" y="220" width="135" height="100" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="452.5" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Hipótesis</text>
<line x1="520" y1="270" x2="545" y2="270" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="545" y="220" width="135" height="100" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="612.5" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Prueba</text>
<line x1="680" y1="270" x2="705" y2="270" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="705" y="220" width="135" height="100" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="772.5" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Dato</text>
<line x1="840" y1="270" x2="865" y2="270" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="865" y="220" width="135" height="100" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="932.5" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Cambio mínimo</text>
<line x1="1000" y1="270" x2="1025" y2="270" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1025" y="220" width="135" height="100" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="1092.5" y="262" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Retest</text>
<text x="600" y="420" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">No cambiar cosas al azar: cada prueba debe confirmar o descartar una hipótesis</text>
</svg>