<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Evidencias técnicas para validar el laboratorio</title>
  <desc id="desc">Evidencias técnicas para validar el laboratorio</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" rx="30" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Triángulo de evidencias técnicas</text>
<rect x="80" y="170" width="300" height="210" rx="22" fill="#1f2937" stroke="#a78bfa" stroke-width="3" filter="url(#shadow)"/>
<text x="230.0" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Configuración</text>
<text x="230.0" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">IP persistente</text>
<text x="230.0" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">ruta correcta</text>
<text x="230.0" y="308" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">archivo o perfil</text>
<rect x="450" y="170" width="300" height="210" rx="22" fill="#1f2937" stroke="#60a5fa" stroke-width="3" filter="url(#shadow)"/>
<text x="600.0" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Operación</text>
<text x="600.0" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">servicio activo</text>
<text x="600.0" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">socket / proceso</text>
<text x="600.0" y="308" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">logs coherentes</text>
<rect x="820" y="170" width="300" height="210" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="970.0" y="212" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Cliente</text>
<text x="970.0" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">ping / curl</text>
<text x="970.0" y="278" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">prueba positiva</text>
<text x="970.0" y="308" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">prueba negativa</text>
<line x1="380" y1="275" x2="450" y2="275" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="750" y1="275" x2="820" y2="275" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<text x="600" y="475" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Una sola captura rara vez demuestra por sí sola que el servicio funciona</text>
</svg>