<text x="600.0" y="147" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">Internet</text>
<text x="600.0" y="183" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">actualizaciones / paquetes</text>
<line x1="600" y1="210" x2="600" y2="270" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="395" y="275" width="410" height="150" rx="22" fill="#1f2937" stroke="#34d399" stroke-width="3" filter="url(#shadow)"/>
<text x="600.0" y="317" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">srv-pXX-lYY</text>
<text x="600.0" y="353" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">Debian 13</text>
<text x="600.0" y="383" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">NIC 1 NAT · NIC 2 SRI-Pxx</text>
<line x1="600" y1="425" x2="600" y2="500" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
<text x="600" y="475" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#93c5fd">Red interna aislada · SRI-Pxx</text>
<rect x="100" y="505" width="340" height="110" rx="22" fill="#1f2937" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
<text x="270.0" y="547" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">cli-pXX-lYY</text>
<text x="270.0" y="583" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">Linux o Windows</text>
<rect x="760" y="505" width="340" height="110" rx="22" fill="#1f2937" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
<text x="930.0" y="547" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#f8fafc">pruebas / capturas</text>
<text x="930.0" y="583" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" fill="#cbd5e1">cliente, logs, evidencias</text>
