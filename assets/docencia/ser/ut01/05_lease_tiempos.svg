</style><text x="60" y="58" class="t h" text-anchor="start">Lease · T1 · T2 · expiración</text><rect x="80" y="230" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#4E9F6E" stroke-width="3"/><text x="175.0" y="269" class="t s" text-anchor="middle">ACK / BOUND</text><text x="175.0" y="298" class="t sm" text-anchor="middle">cliente usa la IP</text><rect x="360" y="230" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#2F5597" stroke-width="3"/><text x="455.0" y="269" class="t s" text-anchor="middle">T1 / RENEWING</text><text x="455.0" y="298" class="t sm" text-anchor="middle">renueva con servidor</text><rect x="660" y="230" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#E58A2B" stroke-width="3"/><text x="755.0" y="269" class="t s" text-anchor="middle">T2 / REBINDING</text><text x="755.0" y="298" class="t sm" text-anchor="middle">busca cualquier servidor</text><rect x="950" y="230" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#C94C4C" stroke-width="3"/><text x="1045.0" y="269" class="t s" text-anchor="middle">EXPIRA</text><text x="1045.0" y="298" class="t sm" text-anchor="middle">deja de usar la IP</text><path d="M270,290 L360,290" class="line" stroke="#17365D"/><polygon points="360,290 345,281 345,299" fill="#17365D"/><path d="M550,290 L660,290" class="line" stroke="#17365D"/><polygon points="660,290 645,281 645,299" fill="#17365D"/><path d="M850,290 L950,290" class="line" stroke="#17365D"/><polygon points="950,290 935,281 935,299" fill="#17365D"/><text x="600" y="450" class="t s" text-anchor="middle">Ejemplo docente: T1 900 s · T2 1800 s · Lease 3600 s</text><text x="600" y="505" class="t b" text-anchor="middle">Debe mantenerse: T1 &lt; T2 &lt; tiempo válido.</text></svg>