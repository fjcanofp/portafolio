<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
<rect width="1200" height="460" fill="white"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1F6B4F">Windows Server 2022 vs 2025</text>
<rect x="80" y="115" rx="12" width="430" height="250" fill="#F4F6F5" stroke="#666666" stroke-width="3"/>
<text x="295.0" y="143" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">Windows Server 2022</text>
<text x="295.0" y="170" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">DHCP / RRAS válidos · soporte extendido</text>
<rect x="690" y="115" rx="12" width="430" height="250" fill="#EAF3EE" stroke="#1F6B4F" stroke-width="3"/>
<text x="905.0" y="143" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">Windows Server 2025</text>
<text x="905.0" y="170" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">DHCP / RRAS válidos · LTSC actual</text>
<text x="295" y="230" text-anchor="middle" font-family="Arial" font-size="18">mismos objetos DHCP</text>
<text x="295" y="265" text-anchor="middle" font-family="Arial" font-size="18">mismos cmdlets principales</text>
<text x="905" y="230" text-anchor="middle" font-family="Arial" font-size="18">mismos objetos DHCP</text>
<text x="905" y="265" text-anchor="middle" font-family="Arial" font-size="18">mismos cmdlets principales</text>
<line x1="510" y1="240" x2="690" y2="240" stroke="#2F5597" stroke-width="4"/>
<text x="600" y="215" text-anchor="middle" font-family="Arial" font-size="16">comparar sin inventar diferencias</text>
</svg>