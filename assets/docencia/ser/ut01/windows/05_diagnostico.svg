<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="white"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1F6B4F">Diagnóstico por capas</text><rect x="180" y="100" rx="12" width="840" height="70" fill="#F4F6F5" stroke="#1F6B4F" stroke-width="3"/>
<text x="600.0" y="128" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">1 · VirtualBox</text>
<text x="600.0" y="155" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">¿WAN y LAN están conectadas al segmento correcto?</text><line x1="600" y1="170" x2="600" y2="190" stroke="#777" stroke-width="3"/><polygon points="600,190 591,176 609,176" fill="#777"/><rect x="180" y="190" rx="12" width="840" height="70" fill="#F4F6F5" stroke="#1F6B4F" stroke-width="3"/>
<text x="600.0" y="218" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">2 · Servidor</text>
<text x="600.0" y="245" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">¿WAN tiene Internet? ¿LAN tiene IP fija? ¿solo una ruta por defecto?</text><line x1="600" y1="260" x2="600" y2="280" stroke="#777" stroke-width="3"/><polygon points="600,280 591,266 609,266" fill="#777"/><rect x="180" y="280" rx="12" width="840" height="70" fill="#F4F6F5" stroke="#1F6B4F" stroke-width="3"/>
<text x="600.0" y="308" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">3 · DHCP</text>
<text x="600.0" y="335" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">¿servicio, binding y ámbito están activos?</text><line x1="600" y1="350" x2="600" y2="370" stroke="#777" stroke-width="3"/><polygon points="600,370 591,356 609,356" fill="#777"/><rect x="180" y="370" rx="12" width="840" height="70" fill="#F4F6F5" stroke="#1F6B4F" stroke-width="3"/>
<text x="600.0" y="398" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">4 · Cliente</text>
<text x="600.0" y="425" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">¿recibe IP, máscara, gateway y DNS?</text><line x1="600" y1="440" x2="600" y2="460" stroke="#777" stroke-width="3"/><polygon points="600,460 591,446 609,446" fill="#777"/><rect x="180" y="460" rx="12" width="840" height="70" fill="#F4F6F5" stroke="#1F6B4F" stroke-width="3"/>
<text x="600.0" y="488" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">5 · RRAS/NAT</text>
<text x="600.0" y="515" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">¿el cliente llega al gateway y sale por la WAN?</text><line x1="600" y1="530" x2="600" y2="550" stroke="#777" stroke-width="3"/><polygon points="600,550 591,536 609,536" fill="#777"/><rect x="180" y="550" rx="12" width="840" height="70" fill="#F4F6F5" stroke="#1F6B4F" stroke-width="3"/>
<text x="600.0" y="578" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">6 · DNS / aplicación</text>
<text x="600.0" y="605" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">¿resuelve nombres y funciona TCP/HTTP?</text></svg>