</style><text x="60" y="58" class="t h" text-anchor="start">Diseñar antes de configurar</text><rect x="90" y="170" width="145" height="150" rx="12" fill="#6B7785" opacity="0.18" stroke="#6B7785" stroke-width="3"/><text x="162.5" y="228" class="t s" text-anchor="middle">.0</text><text x="162.5" y="265" class="t sm" text-anchor="middle">red</text><rect x="235" y="170" width="180" height="150" rx="12" fill="#E58A2B" opacity="0.18" stroke="#E58A2B" stroke-width="3"/><text x="325.0" y="228" class="t s" text-anchor="middle">.1–.49</text><text x="325.0" y="265" class="t sm" text-anchor="middle">infraestructura</text><rect x="415" y="170" width="185" height="150" rx="12" fill="#2F5597" opacity="0.18" stroke="#2F5597" stroke-width="3"/><text x="507.5" y="228" class="t s" text-anchor="middle">.50–.99</text><text x="507.5" y="265" class="t sm" text-anchor="middle">reservas</text><rect x="600" y="170" width="300" height="150" rx="12" fill="#4E9F6E" opacity="0.18" stroke="#4E9F6E" stroke-width="3"/><text x="750.0" y="228" class="t s" text-anchor="middle">.100–.149</text><text x="750.0" y="265" class="t sm" text-anchor="middle">pool dinámico</text><rect x="900" y="170" width="210" height="150" rx="12" fill="#2AA7B8" opacity="0.18" stroke="#2AA7B8" stroke-width="3"/><text x="1005.0" y="228" class="t s" text-anchor="middle">.150–.254</text><text x="1005.0" y="265" class="t sm" text-anchor="middle">crecimiento</text><text x="600" y="400" class="t s" text-anchor="middle">192.168.50.0/24 · ejemplo base</text><text x="600" y="470" class="t b" text-anchor="middle">No metas en el pool la IP del servidor, reservas ni direcciones estáticas conocidas.</text><text x="600" y="520" class="t sm" text-anchor="middle">La dirección .255 es broadcast y tampoco se entrega.</text></svg>