<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:28px;font-weight:bold}.t{font-size:19px}.box{fill:#f7f7f7;stroke:#1f6b4f;stroke-width:2}</style><text x="600" y="42" text-anchor="middle" class="h">Escalera de diagnóstico</text><rect x="170" y="90" width="390" height="65" rx="12" class="box"/><text x="365" y="130" text-anchor="middle" class="t">1. VirtualBox / NIC correcta</text><rect x="620" y="90" width="390" height="65" rx="12" class="box"/><text x="815" y="130" text-anchor="middle" class="t">2. IP estática del servidor</text><rect x="170" y="185" width="390" height="65" rx="12" class="box"/><text x="365" y="225" text-anchor="middle" class="t">3. Servidor tiene Internet</text><rect x="620" y="185" width="390" height="65" rx="12" class="box"/><text x="815" y="225" text-anchor="middle" class="t">4. Servicio DHCP activo</text><rect x="170" y="280" width="390" height="65" rx="12" class="box"/><text x="365" y="320" text-anchor="middle" class="t">5. Ámbito activo y con direcciones</text><rect x="620" y="280" width="390" height="65" rx="12" class="box"/><text x="815" y="320" text-anchor="middle" class="t">6. Binding DHCP correcto</text><rect x="170" y="375" width="390" height="65" rx="12" class="box"/><text x="365" y="415" text-anchor="middle" class="t">7. Cliente recibe IP/gateway/DNS</text><rect x="620" y="375" width="390" height="65" rx="12" class="box"/><text x="815" y="415" text-anchor="middle" class="t">8. RRAS/NAT activo</text><rect x="170" y="470" width="390" height="65" rx="12" class="box"/><text x="365" y="510" text-anchor="middle" class="t">9. Cliente llega a gateway</text><rect x="620" y="470" width="390" height="65" rx="12" class="box"/><text x="815" y="510" text-anchor="middle" class="t">10. Cliente llega a Internet</text></svg>