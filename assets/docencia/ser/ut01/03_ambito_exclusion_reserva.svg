<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460"><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:28px;font-weight:bold}.t{font-size:20px}.s{font-size:17px}.b{stroke:#222;stroke-width:2}.lab{font-size:18px;font-weight:bold}</style><text x="600" y="45" text-anchor="middle" class="h">Cómo pensar un ámbito de Windows DHCP</text><text x="90" y="105" class="t">Ejemplo didáctico: 192.168.150.0/24</text><rect x="90" y="145" width="1020" height="80" fill="#f4f6f5" class="b"/><rect x="90" y="145" width="255" height="80" fill="#dddddd" class="b"/><rect x="345" y="145" width="510" height="80" fill="#ffffff" class="b"/><rect x="855" y="145" width="255" height="80" fill="#dddddd" class="b"/><text x="217" y="190" text-anchor="middle" class="lab">Exclusión / reserva</text><text x="600" y="190" text-anchor="middle" class="lab">Direcciones dinámicas</text><text x="982" y="190" text-anchor="middle" class="lab">Exclusión</text><text x="90" y="260" class="s">Intervalo del ámbito: .20 - .220</text><text x="90" y="295" class="s">Exclusiones: .20 - .79 y .180 - .220</text><text x="90" y="330" class="s">Dinámicas efectivas: .80 - .179</text><text x="90" y="365" class="s">Una reserva puede estar dentro del intervalo y a la vez quedar excluida de la asignación dinámica.</text></svg>