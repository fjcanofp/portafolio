<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Permisos Linux"><rect width="1200" height="675" rx="24" fill="#F5F8FC"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#263238}.h{font-size:34px;font-weight:700;fill:#17365D}.s{font-size:24px;font-weight:700}.b{font-size:20px}.sm{font-size:17px;fill:#6B7785}.line{stroke:#17365D;stroke-width:5;fill:none}.dash{stroke:#6B7785;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><text x="60" y="58" class="t h" text-anchor="start">Permisos Linux: leerlos sin miedo</text><text x="600" y="150" class="t s" text-anchor="middle">-  r w x   r - x   - - -</text><rect x="120" y="220" width="270" height="120" rx="18" fill="#EDF7EE" stroke="#4E9F6E" stroke-width="3"/><text x="255.0" y="260" class="t s" text-anchor="middle">u · propietario</text><text x="255.0" y="290" class="t sm" text-anchor="middle">rwx = 7</text><rect x="465" y="220" width="270" height="120" rx="18" fill="#E7F7F9" stroke="#2AA7B8" stroke-width="3"/><text x="600.0" y="260" class="t s" text-anchor="middle">g · grupo</text><text x="600.0" y="290" class="t sm" text-anchor="middle">r-x = 5</text><rect x="810" y="220" width="270" height="120" rx="18" fill="#FFF3E6" stroke="#E58A2B" stroke-width="3"/><text x="945.0" y="260" class="t s" text-anchor="middle">o · otros</text><text x="945.0" y="290" class="t sm" text-anchor="middle">--- = 0</text><text x="600" y="430" class="t s" text-anchor="middle">r = 4   ·   w = 2   ·   x = 1</text><text x="600" y="500" class="t b" text-anchor="middle">750 → dueño rwx · grupo r-x · otros ---</text><text x="600" y="550" class="t sm" text-anchor="middle">En directorios, x significa atravesar la ruta.</text></svg>