<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Solo-anfitrión · host y VM"><rect width="1200" height="675" rx="24" fill="#F5F8FC"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#263238}.h{font-size:34px;font-weight:700;fill:#17365D}.s{font-size:24px;font-weight:700}.b{font-size:20px}.sm{font-size:17px;fill:#6B7785}.line{stroke:#17365D;stroke-width:5;fill:none}.dash{stroke:#6B7785;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><text x="60" y="58" class="t h" text-anchor="start">Solo-anfitrión · host y VM</text><text x="60" y="92" class="t sm" text-anchor="start">VirtualBox crea una interfaz virtual en el host.</text><rect x="90" y="235" width="250" height="110" rx="18" fill="#E8EEF7" stroke="#2F5597" stroke-width="3"/><text x="215.0" y="275" class="t s" text-anchor="middle">HOST</text><text x="215.0" y="305" class="t sm" text-anchor="middle">interfaz host-only</text><rect x="475" y="235" width="250" height="110" rx="18" fill="#FFF3E6" stroke="#E58A2B" stroke-width="3"/><text x="600.0" y="275" class="t s" text-anchor="middle">Red host-only</text><text x="600.0" y="305" class="t sm" text-anchor="middle">sin Internet por defecto</text><rect x="870" y="235" width="240" height="110" rx="18" fill="#FFFFFF" stroke="#4E9F6E" stroke-width="3"/><text x="990.0" y="275" class="t s" text-anchor="middle">VM Debian</text><text x="990.0" y="305" class="t sm" text-anchor="middle">dirección privada</text><path d="M340,290 L475,290" class="line" stroke="#E58A2B"/><polygon points="475,290 460,281 460,299" fill="#E58A2B"/><path d="M725,290 L870,290" class="line" stroke="#E58A2B"/><polygon points="870,290 855,281 855,299" fill="#E58A2B"/><rect x="70" y="560" width="1060" height="75" rx="16" fill="#FFF7E9" stroke="#E58A2B" stroke-width="2"/><text x="600" y="607" class="t b" text-anchor="middle">Útil para administrar desde el host; revisa si el DHCP integrado está activo.</text></svg>