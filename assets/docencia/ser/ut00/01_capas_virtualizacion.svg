<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Capas de virtualización"><rect width="1200" height="675" rx="24" fill="#F5F8FC"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#263238}.h{font-size:34px;font-weight:700;fill:#17365D}.s{font-size:24px;font-weight:700}.b{font-size:20px}.sm{font-size:17px;fill:#6B7785}.line{stroke:#17365D;stroke-width:5;fill:none}.dash{stroke:#6B7785;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><text x="60" y="58" class="t h" text-anchor="start">Virtualización: qué ocurre realmente</text><rect x="80" y="105" width="1040" height="105" rx="18" fill="#E8EEF7" stroke="#2F5597" stroke-width="3"/><text x="600.0" y="145" class="t s" text-anchor="middle">HOST · equipo físico</text><text x="600.0" y="175" class="t sm" text-anchor="middle">CPU · RAM · SSD · NIC física</text><rect x="80" y="235" width="1040" height="95" rx="18" fill="#E7F7F9" stroke="#2AA7B8" stroke-width="3"/><text x="600.0" y="275" class="t s" text-anchor="middle">HIPERVISOR · VirtualBox</text><text x="600.0" y="305" class="t sm" text-anchor="middle">reparte recursos y conecta redes virtuales</text><rect x="80" y="355" width="1040" height="100" rx="18" fill="#EDF7EE" stroke="#4E9F6E" stroke-width="3"/><text x="600.0" y="395" class="t s" text-anchor="middle">HARDWARE VIRTUAL</text><text x="600.0" y="425" class="t sm" text-anchor="middle">vCPU · RAM virtual · disco VDI · vNIC</text><rect x="115" y="485" width="435" height="115" rx="18" fill="#FFFFFF" stroke="#4E9F6E" stroke-width="3"/><text x="332.5" y="525" class="t s" text-anchor="middle">GUEST 1 · Debian 13</text><text x="332.5" y="555" class="t sm" text-anchor="middle">ser-ser01</text><rect x="650" y="485" width="435" height="115" rx="18" fill="#FFFFFF" stroke="#4E9F6E" stroke-width="3"/><text x="867.5" y="525" class="t s" text-anchor="middle">GUEST 2 · Debian / Windows</text><text x="867.5" y="555" class="t sm" text-anchor="middle">ser-cli01 / ser-win01</text><text x="600" y="640" class="t sm" text-anchor="middle">La VM usa recursos del host; no los crea.</text></svg>