<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520">
<rect width="1200" height="520" fill="white"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1F6B4F">Primario Debian → secundario Windows</text>
<rect x="90" y="150" rx="12" width="350" height="180" fill="#EAF3EE" stroke="#1F6B4F" stroke-width="3"/>
<text x="265.0" y="180" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">Debian 13 · BIND9</text>
<text x="265.0" y="210" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">PRIMARY</text>
<rect x="760" y="150" rx="12" width="350" height="180" fill="#EAF1FB" stroke="#2F5597" stroke-width="3"/>
<text x="935.0" y="180" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">Windows Server 2022/2025</text>
<text x="935.0" y="210" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">SECONDARY</text>
<line x1="440" y1="215" x2="760" y2="215" stroke="#2F5597" stroke-width="5"/><polygon points="760,215 744,207 744,223" fill="#2F5597"/>
<text x="600" y="195" text-anchor="middle" font-family="Arial" font-size="18">transferencia de zona por TCP</text>
<line x1="760" y1="285" x2="440" y2="285" stroke="#777" stroke-width="3"/><polygon points="440,285 456,277 456,293" fill="#777"/>
<text x="600" y="335" text-anchor="middle" font-family="Arial" font-size="17">SOA serial indica si hay una versión nueva</text>
<text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="17" fill="#A61B1B">BIND 9.20 no permite transferencias salientes si no se autoriza explícitamente.</text>
</svg>