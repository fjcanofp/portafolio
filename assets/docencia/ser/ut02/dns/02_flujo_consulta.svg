<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520">
<rect width="1200" height="520" fill="white"/>
<text x="600" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1F6B4F">Qué hace nuestro servidor DNS</text>
<rect x="50" y="180" rx="12" width="220" height="120" fill="#F4F6F5" stroke="#666666" stroke-width="3"/>
<text x="160.0" y="210" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">Cliente</text>
<text x="160.0" y="240" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">pregunta un nombre</text>
<rect x="350" y="125" rx="12" width="350" height="230" fill="#EAF3EE" stroke="#1F6B4F" stroke-width="3"/>
<text x="525.0" y="155" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">BIND9 / Windows DNS</text>
<text x="525.0" y="185" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">zona + caché + reenvío</text>
<rect x="805" y="180" rx="12" width="340" height="120" fill="#EAF1FB" stroke="#2F5597" stroke-width="3"/>
<text x="975.0" y="210" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#202020">DNS ascendente</text>
<text x="975.0" y="240" text-anchor="middle" font-family="Arial" font-size="16" fill="#333333">respuesta externa</text>
<line x1="270" y1="240" x2="350" y2="240" stroke="#1F6B4F" stroke-width="5"/>
<line x1="700" y1="240" x2="805" y2="240" stroke="#2F5597" stroke-width="5"/>
<text x="525" y="195" text-anchor="middle" font-family="Arial" font-size="18">1. ¿soy autoritativo?</text>
<text x="525" y="235" text-anchor="middle" font-family="Arial" font-size="18">2. ¿está en caché?</text>
<text x="525" y="275" text-anchor="middle" font-family="Arial" font-size="18">3. resolver / reenviar</text>
<text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="17" fill="#A61B1B">Resolver un nombre local y resolver Internet son funciones relacionadas, pero distintas.</text>
</svg>