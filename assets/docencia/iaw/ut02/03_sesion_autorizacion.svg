<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Sesión, identidad y autorización</title><desc id="d">Flujo desde cookie de sesión hasta comprobación de permisos en servidor.</desc><defs><style>.b{fill:#0f1720;stroke:#58a6ff;stroke-width:2}.g{fill:#08281b;stroke:#2ee97d;stroke-width:2}.x{font:18px sans-serif;fill:#e6edf3}.s{font:14px sans-serif;fill:#9fb3c8}.a{stroke:#9fb3c8;stroke-width:3;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb3c8"/></marker></defs><rect width="960" height="360" rx="24" fill="#090d13"/><rect class="b" x="45" y="120" width="170" height="95" rx="14"/><text class="x" x="130" y="155" text-anchor="middle">Navegador</text><text class="s" x="130" y="183" text-anchor="middle">cookie de sesión</text><rect class="b" x="285" y="120" width="170" height="95" rx="14"/><text class="x" x="370" y="155" text-anchor="middle">PHP</text><text class="s" x="370" y="183" text-anchor="middle">session_start()</text><rect class="g" x="525" y="120" width="170" height="95" rx="14"/><text class="x" x="610" y="155" text-anchor="middle">Identidad</text><text class="s" x="610" y="183" text-anchor="middle">user_id / role</text><rect class="g" x="765" y="120" width="150" height="95" rx="14"/><text class="x" x="840" y="155" text-anchor="middle">Autorización</text><text class="s" x="840" y="183" text-anchor="middle">¿puede hacerlo?</text><path class="a" d="M215 168 H285"/><path class="a" d="M455 168 H525"/><path class="a" d="M695 168 H765"/><text class="s" x="480" y="295" text-anchor="middle">La identidad no debe proceder de un parámetro controlado por el cliente</text></svg>