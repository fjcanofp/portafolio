<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Transacción: commit o rollback</title><desc id="d">Dos operaciones se confirman juntas o se revierten si aparece un error.</desc><defs><style>.b{fill:#0f1720;stroke:#58a6ff;stroke-width:2}.g{fill:#08281b;stroke:#2ee97d;stroke-width:2}.r{fill:#2a1215;stroke:#ff6b6b;stroke-width:2}.x{font:18px sans-serif;fill:#e6edf3}.s{font:14px sans-serif;fill:#9fb3c8}.a{stroke:#9fb3c8;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fb3c8"/></marker></defs><rect width="960" height="420" rx="24" fill="#090d13"/><rect class="b" x="365" y="35" width="230" height="65" rx="14"/><text class="x" x="480" y="75" text-anchor="middle">beginTransaction()</text><rect class="b" x="365" y="140" width="230" height="65" rx="14"/><text class="x" x="480" y="180" text-anchor="middle">Operación A</text><rect class="b" x="365" y="245" width="230" height="65" rx="14"/><text class="x" x="480" y="285" text-anchor="middle">Operación B</text><rect class="g" x="660" y="245" width="190" height="65" rx="14"/><text class="x" x="755" y="285" text-anchor="middle">commit()</text><rect class="r" x="110" y="245" width="190" height="65" rx="14"/><text class="x" x="205" y="285" text-anchor="middle">rollBack()</text><path class="a" d="M480 100V140"/><path class="a" d="M480 205V245"/><path class="a" d="M595 278H660"/><path class="a" d="M365 278H300"/><text class="s" x="630" y="258">todo OK</text><text class="s" x="330" y="258" text-anchor="end">error</text><text class="s" x="480" y="370" text-anchor="middle">Objetivo: evitar estados parciales cuando varias escrituras forman una única operación lógica</text></svg>