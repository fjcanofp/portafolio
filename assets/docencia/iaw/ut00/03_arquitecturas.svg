="600.0" y="305" class="t sm" text-anchor="middle">Apache + PHP + app</text><rect x="475" y="390" width="250" height="95" rx="18" fill="#F5F8FC" stroke="#B54747" stroke-width="3"/><text x="600.0" y="430" class="t s" text-anchor="middle">BBDD</text><text x="600.0" y="460" class="t sm" text-anchor="middle">MariaDB</text><path d="M600,330 L600,390" class="line" stroke="#17365D"/><polygon points="600,390 585,381 585,399" fill="#17365D"/><rect x="815" y="145" width="330" height="380" rx="18" fill="#FFFFFF" stroke="#3D8B66" stroke-width="3"/><text x="980.0" y="185" class="t s" text-anchor="middle">Multinivel</text><text x="980.0" y="215" class="t sm" text-anchor="middle">roles separados</text><rect x="855" y="205" width="250" height="60" rx="18" fill="#F5F8FC" stroke="#D78324" stroke-width="3"/><text x="980.0" y="245" class="t s" text-anchor="middle">Proxy</text><text x="980.0" y="275" class="t sm" text-anchor="middle">entrada</text><rect x="855" y="300" width="250" height="60" rx="18" fill="#F5F8FC" stroke="#17365D" stroke-width="3"/><text x="980.0" y="340" class="t s" text-anchor="middle">Apps</text><text x="980.0" y="370" class="t sm" text-anchor="middle">uno o varios nodos</text><rect x="855" y="395" width="250" height="60" rx="18" fill="#F5F8FC" stroke="#B54747" stroke-width="3"/><text x="980.0" y="435" class="t s" text-anchor="middle">BBDD</text><text x="980.0" y="465" class="t sm" text-anchor="middle">persistencia</text><path d="M980,265 L980,300" class="line" stroke="#17365D"/><polygon points="980,300 965,291 965,309" fill="#17365D"/><path d="M980,360 L980,395" class="line" stroke="#17365D"/><polygon points="980,395 965,386 965,404" fill="#17365D"/><text x="600" y="600" class="t b" text-anchor="middle">Separar capas facilita aprender responsabilidades, permisos, flujos y diagnóstico.</text></svg>