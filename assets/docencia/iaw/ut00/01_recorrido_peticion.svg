<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Recorrido de una petición web"><rect width="1200" height="675" rx="24" fill="#F5F8FC"/><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#25313C}.h{font-size:34px;font-weight:700;fill:#17365D}.s{font-size:24px;font-weight:700}.b{font-size:20px}.sm{font-size:17px;fill:#677583}.line{stroke:#17365D;stroke-width:5;fill:none}.dash{stroke:#677583;stroke-width:4;stroke-dasharray:10 8;fill:none}</style><text x="55" y="56" class="t h" text-anchor="start">De una URL a una respuesta: recorrido completo</text><rect x="60" y="240" width="170" height="105" rx="18" fill="#FFFFFF" stroke="#2F5597" stroke-width="3"/><text x="145.0" y="280" class="t s" text-anchor="middle">Navegador</text><text x="145.0" y="310" class="t sm" text-anchor="middle">cliente</text><rect x="255" y="240" width="170" height="105" rx="18" fill="#FFFFFF" stroke="#D78324" stroke-width="3"/><text x="340.0" y="280" class="t s" text-anchor="middle">DNS</text><text x="340.0" y="310" class="t sm" text-anchor="middle">nombre → IP</text><rect x="450" y="240" width="170" height="105" rx="18" fill="#FFFFFF" stroke="#138A91" stroke-width="3"/><text x="535.0" y="280" class="t s" text-anchor="middle">Apache / NGINX</text><text x="535.0" y="310" class="t sm" text-anchor="middle">servidor web</text><rect x="680" y="240" width="170" height="105" rx="18" fill="#FFFFFF" stroke="#3D8B66" stroke-width="3"/><text x="765.0" y="280" class="t s" text-anchor="middle">Runtime</text><text x="765.0" y="310" class="t sm" text-anchor="middle">PHP-FPM / Tomcat</text><rect x="895" y="240" width="170" height="105" rx="18" fill="#FFFFFF" stroke="#17365D" stroke-width="3"/><text x="980.0" y="280" class="t s" text-anchor="middle">Aplicación</text><text x="980.0" y="310" class="t sm" text-anchor="middle">lógica</text><path d="M230,292 L255,292" class="line" stroke="#17365D"/><polygon points="255,292 240,283 240,301" fill="#17365D"/><path d="M425,292 L450,292" class="line" stroke="#17365D"/><polygon points="450,292 435,283 435,301" fill="#17365D"/><path d="M620,292 L680,292" class="line" stroke="#17365D"/><polygon points="680,292 665,283 665,301" fill="#17365D"/><path d="M850,292 L895,292" class="line" stroke="#17365D"/><polygon points="895,292 880,283 880,301" fill="#17365D"/><rect x="680" y="425" width="385" height="105" rx="18" fill="#FFFFFF" stroke="#B54747" stroke-width="3"/><text x="872.5" y="465" class="t s" text-anchor="middle">MariaDB / servicios</text><text x="872.5" y="495" class="t sm" text-anchor="middle">datos persistentes</text><path d="M980,345 L875,425" class="line" stroke="#B54747"/><polygon points="875,425 860,416 860,434" fill="#B54747"/><text x="600" y="615" class="t b" text-anchor="middle">Una respuesta correcta depende de varias capas; un fallo puede estar en cualquiera.</text></svg>