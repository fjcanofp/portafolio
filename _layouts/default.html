<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es' }}">

  {% include head.html %}

  <body>

    <a
      class="skip-link"
      href="#main-content"
    >
      Saltar al contenido principal
    </a>

    {% include header.html %}

    <main id="main-content">
      {{ content }}
    </main>

    {% include footer.html %}

    {% assign asset_version =
      site.time | date: "%s"
    %}

    <script
      src="{{ '/assets/js/site.js' | relative_url }}?v={{ asset_version }}"
    ></script>

  </body>

</html>
